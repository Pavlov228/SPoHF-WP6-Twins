# Blue irrigation twin — configuration.
#
# Kept blue-local on purpose (issue 065): the fusion knobs and the override list
# are irrigation concerns, not device metadata. The probe names must exist in
# blue/metadata.yaml, which stays the source of truth for what a device is;
# the loader rejects a name it does not know.

# The soil-moisture probes in the plants' peat substrate. None sits
# next to a dripper (see docs/research/blueberry-irrigation.md §4.1).
probes:
  - "SPoHF_EC-BV_rij1"
  - "SPoHF_EC-BV_rij2"
  - "SPoHF_EC-BV_rij3"
  - "SPoHF_EC-BV_rij4"
  - "SPoHF_EC-BV_rij5"
  - "01 | 0E5E | BV + EC + BT"
  - "02 | 0E4F | BV + EC + BT"
  - "03 | 0E09 | BV + EC + BT"
  - "04 | 0E69 | BV + EC + BT"
  - "BV + BT + EC | Nr. 6"

sensor: "soilMoisture"
# Each probe's own soil temperature, read alongside it for the frozen mask.
temperature_sensor: "soilTemperature"

# Earliest data used. Normalisation references are taken over everything from
# here on, so the scale does not move with the window being viewed.
history_start: "2024-03-01"

fusion:
  # Readings below this are a probe that lost contact with drying peat, not a
  # measurement (research note §4.2). Unit: the sensor's own %VWC.
  floor: 1.0
  # Readings this close to a sub-floor run are partial contact; drop them too.
  dropout_pad_hours: 3
  # Hampel spike filter: centred window, threshold in robust SDs, and a floor
  # on the spread so a quiet signal is not flagged for ordinary noise.
  spike_window_hours: 7
  spike_k: 5.0
  spike_min_spread: 0.5
  # Per-probe scale: these quantiles of its clean history map to 0 and 1.
  reference_low_quantile: 0.02
  reference_high_quantile: 0.98
  # A probe whose day-to-day changes stop tracking the others is masked for
  # that stretch. Needs this many probes to form a consensus at all.
  consensus_window_days: 30
  consensus_min_corr: 0.3
  consensus_min_probes: 3
  # At or below this soil temperature (°C) the probe may be reading ice, which
  # looks like dry soil; a thaw then looks like rain. Masked as "frozen".
  frozen_below_c: 1.0

# Rain at the field. The on-site gauge catches local showers that Open-Meteo's
# reanalysis underestimates, but it has failed for whole months (research note
# §5), so it is checked against Open-Meteo over a rolling window. Where
# Open-Meteo saw at least `min_reference_mm` and the gauge less than
# `min_ratio` of it, the gauge is treated as faulty for that stretch and
# Open-Meteo stands in.
rain:
  station_device: "weatherstation"
  station_sensor: "precipitation"
  # Gauge hours above this, or with any negative reading, are impossible
  # (commissioning junk swung ±85 mm on 2024-03-26) and are dropped.
  max_mm_per_hour: 60.0
  check_window_days: 14
  min_reference_mm: 5.0
  min_ratio: 0.3

# Watering (drip fertigation) events, from the farm's fertigation CSV upload.
# The CSV is date-only and the doses don't show on the soil probes (research
# note §4.1), so the clock time is a configured default (the farm waters in
# the late afternoon), in the field's local time.
watering:
  volume_sensor: "volume_ml_per_plant"
  duration_sensor: "duration_min"
  default_local_time: "17:00"
  timezone: "Europe/Amsterdam"

# The forecast model (ADR 0009). The probes don't see drip, so its effect is tied
# to rain: a litre per plant counts as a millimetre of rain over this area. The
# pooled fit's ratio was ~2.2 m², consistent with a plant every 1–2 m.
model:
  area_per_plant_m2: 2.2

# Manual override for a fault the mechanical checks miss. Prefer improving a
# check over adding an entry here. Entries: {probe, start, end, reason}.
exclude: []
