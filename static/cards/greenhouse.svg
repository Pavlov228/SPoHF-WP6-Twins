<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" width="600" height="200">
  <defs>
    <linearGradient id="ghFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="25%" stop-color="white" stop-opacity="0"/>
      <stop offset="55%" stop-color="white" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
    <mask id="ghMask">
      <rect x="0" y="0" width="600" height="200" fill="url(#ghFade)"/>
    </mask>
  </defs>
  <g mask="url(#ghMask)" fill="none" stroke="white" stroke-linejoin="round" stroke-linecap="round">
    <!-- roof: a row of small ridges, one vent open -->
    <path d="M300 70 L330 46 L360 70 L390 46 L420 70 L450 46 L480 70 L510 46 L540 70 L570 46 L600 70"
