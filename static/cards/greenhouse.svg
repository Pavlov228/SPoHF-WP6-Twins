    </g>
    <g fill="white" stroke="none" fill-opacity="0.45">
      <circle cx="354" cy="112" r="7"/><circle cx="366" cy="128" r="7"/><circle cx="356" cy="146" r="6"/>
      <circle cx="414" cy="110" r="7"/><circle cx="426" cy="126" r="7"/><circle cx="416" cy="148" r="6"/>
      <circle cx="474" cy="114" r="7"/><circle cx="486" cy="130" r="7"/><circle cx="476" cy="150" r="6"/>
      <circle cx="534" cy="110" r="7"/><circle cx="546" cy="128" r="7"/><circle cx="536" cy="146" r="6"/>
    </g>
    <!-- heating pipes along the floor -->
    <path d="M300 184 L600 184 M300 190 L600 190" stroke-width="3" stroke-opacity="0.5"/>
  </g>
