    <path d="M450 46 L472 30" stroke-width="3" stroke-opacity="0.75"/>
    <path d="M300 70 L600 70" stroke-width="2" stroke-opacity="0.45"/>
    <path d="M300 70 L300 186 M600 70 L600 186" stroke-width="2" stroke-opacity="0.4"/>
    <!-- vapour rising -->
    <path d="M395 92 q6 -8 0 -16 q-6 -8 0 -16" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M515 92 q6 -8 0 -16 q-6 -8 0 -16" stroke-width="2" stroke-opacity="0.35"/>
